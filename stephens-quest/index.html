<title>Stephen: The Legend of the Rescue</title>
<style>
  html,body{margin:0;height:100%;background:#0b0b14;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}

<div id="wrap"><canvas id="c" tabindex="0"></canvas></div>
<script>
'use strict';
/* =====================================================================
   STEPHEN'S QUEST — The Rescue of Princess Nicky
   A single-file canvas brawler. No external assets.
   ===================================================================== */

const W = 960, H = 540, FLOOR_TOP = 160, FLOOR_BOT = 518;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let scale = 1;

if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r); this.closePath();
  };
}

function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  const dpr = window.devicePixelRatio || 1;
  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
  cv.width = Math.floor(W * s * dpr);
  cv.height = Math.floor(H * s * dpr);
  scale = s * dpr;
}
addEventListener('resize', resize);
resize();

/* ---------------- helpers ---------------- */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function circ(x, y, r, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, TAU); ctx.fill(); }
function ell(x, y, rx, ry, c, rot = 0) { ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot, 0, TAU); ctx.fill(); }
function line(x1, y1, x2, y2, c, w) { ctx.strokeStyle = c; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function rr(x, y, w, h, r, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); }
function poly(pts, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]); ctx.closePath(); ctx.fill(); }
function star(x, y, r, c, rot = 0) {
  ctx.fillStyle = c; ctx.beginPath();
  for (let i = 0; i < 8; i++) { const a = rot + i * Math.PI / 4, rad = i % 2 ? r * 0.35 : r; ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad); }
  ctx.closePath(); ctx.fill();
}
function heart(x, y, s, c) {
  ctx.fillStyle = c; ctx.beginPath();
  ctx.moveTo(x, y + s * 0.35);
  ctx.bezierCurveTo(x, y, x - s * 0.5, y - s * 0.05, x - s * 0.5, y + s * 0.3);
  ctx.bezierCurveTo(x - s * 0.5, y + s * 0.6, x - s * 0.1, y + s * 0.75, x, y + s);
  ctx.bezierCurveTo(x + s * 0.1, y + s * 0.75, x + s * 0.5, y + s * 0.6, x + s * 0.5, y + s * 0.3);
  ctx.bezierCurveTo(x + s * 0.5, y - s * 0.05, x, y, x, y + s * 0.35);
  ctx.fill();
}
function text(str, x, y, size, color, align = 'center', weight = 'bold', outline = null) {
  ctx.font = `${weight} ${size}px "Trebuchet MS", "Segoe UI", Arial, sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (outline) { ctx.lineJoin = 'round'; ctx.strokeStyle = outline; ctx.lineWidth = Math.max(3, size / 6); ctx.strokeText(str, x, y); }
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}
function wrap(str, maxW, size) {
  ctx.font = `bold ${size}px "Trebuchet MS", "Segoe UI", Arial, sans-serif`;
  const words = str.split(' '); const lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur); return lines;
}

/* ---------------- audio ---------------- */
let actx = null, muted = false;
function initAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } }
  if (actx && actx.state === 'suspended') actx.resume();
}
function tone(f, dur, type = 'square', vol = 0.08, slide = null, delay = 0) {
  if (!actx || muted) return;
  const t0 = actx.currentTime + delay;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0 + dur + 0.02);
}
function sfx(k) {
  switch (k) {
    case 'punch': tone(220, 0.08, 'square', 0.06, 90); break;
    case 'hit': tone(160, 0.1, 'sawtooth', 0.08, 60); tone(400, 0.05, 'square', 0.04, 200); break;
    case 'hurt': tone(300, 0.25, 'sawtooth', 0.09, 80); break;
    case 'die': tone(500, 0.2, 'triangle', 0.08, 100); break;
    case 'splat': tone(120, 0.15, 'triangle', 0.1, 50); break;
    case 'boom': tone(90, 0.4, 'sawtooth', 0.12, 30); break;
    case 'pickup': [660, 880, 1100].forEach((f, i) => tone(f, 0.1, 'square', 0.05, null, i * 0.06)); break;
    case 'smile': [523, 659, 784, 1046, 1318].forEach((f, i) => tone(f, 0.12, 'triangle', 0.07, null, i * 0.05)); break;
    case 'hair': tone(200, 0.3, 'sawtooth', 0.05, 900); tone(300, 0.3, 'triangle', 0.05, 1200, 0.05); break;
    case 'power': [392, 523, 659, 784, 659, 784, 1046].forEach((f, i) => tone(f, 0.18, 'square', 0.06, null, i * 0.11)); break;
    case 'blip': tone(880, 0.04, 'square', 0.03); break;
    case 'boss': tone(110, 0.6, 'sawtooth', 0.1, 55); tone(82, 0.8, 'square', 0.06, 41, 0.2); break;
    case 'win': [523, 523, 659, 784, 0, 659, 784, 1046].forEach((f, i) => f && tone(f, 0.22, 'square', 0.06, null, i * 0.16)); break;
    case 'lose': [392, 349, 311, 262].forEach((f, i) => tone(f, 0.3, 'triangle', 0.08, null, i * 0.25)); break;
  }
}

/* ---------------- input ---------------- */
const keys = {}, pressed = {};
let tapped = false, isTouch = false;
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (!keys[k]) pressed[k] = true;
  keys[k] = true;
  if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'enter'].includes(k)) e.preventDefault();
  initAudio();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
const wasPressed = (...ks) => ks.some(k => pressed[k]);
const held = (...ks) => ks.some(k => keys[k]);

const joy = { id: null, ox: 0, oy: 0, dx: 0, dy: 0 };
const BTNS = [
  { id: 'atk', x: 870, y: 452, r: 52, label: 'SWORD' },
  { id: 'ult', x: 760, y: 370, r: 40, label: 'ULT' },
  { id: 'dash', x: 640, y: 486, r: 36, label: 'DODGE' },
  { id: 'smile', x: 752, y: 478, r: 38, label: 'SMILE' },
  { id: 'hair', x: 880, y: 330, r: 38, label: 'HAIR' },
];
function toLogical(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
cv.addEventListener('pointerdown', e => {
  initAudio(); cv.focus();
  if (e.pointerType === 'touch') isTouch = true;
  const p = toLogical(e);
  tapped = { x: p.x, y: p.y };
  if (scene === 'level' && isTouch) {
    for (const b of BTNS) if (Math.hypot(p.x - b.x, p.y - b.y) < b.r + 14) { pressed['btn_' + b.id] = true; tapped = false; return; }
    if (p.x < W * 0.55 && joy.id === null) { joy.id = e.pointerId; joy.ox = p.x; joy.oy = p.y; joy.dx = joy.dy = 0; tapped = false; }
  }
  e.preventDefault();
});
cv.addEventListener('pointermove', e => {
  if (e.pointerId !== joy.id) return;
  const p = toLogical(e); let dx = p.x - joy.ox, dy = p.y - joy.oy; const d = Math.hypot(dx, dy);
  if (d > 55) { joy.ox = p.x - dx / d * 55; joy.oy = p.y - dy / d * 55; dx = dx / d * 55; dy = dy / d * 55; }
  joy.dx = dx / 55; joy.dy = dy / 55;
});
const endJoy = e => { if (e.pointerId === joy.id) { joy.id = null; joy.dx = joy.dy = 0; } };
cv.addEventListener('pointerup', endJoy); cv.addEventListener('pointercancel', endJoy);
const confirmPressed = () => wasPressed('enter', ' ') || !!tapped;

/* ---------------- persistent state ---------------- */
const SAVE_KEY = 'stephensQuest.v2';
let game = { chapter: 0, look: { muscles: false, handsome: false, hair: false } };
function saveGame() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(game)); } catch (e) { } }
function loadSave() { try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s && s.look && typeof s.chapter === 'number' && s.chapter > 0) return s; } catch (e) { } return null; }
function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) { } }

/* ---------------- story content ---------------- */

const ENDING = {
  bg: 'tower', right: 'nicky', happy: true, pages: [

const REWARDS = {
  muscles: { title: 'THE FORGOTTEN BICEPS', lines: ['For the first time, Stephen feels a little stronger.', 'Sword hits 3x harder and reaches further. More hearts.', 'The fuzzy slippers are retired. Sneakers on!'] },
  restore: { title: 'THE LEGENDARY HAIR RESTORATION', lines: ['Broader shoulders. A sharper jawline. The hair returns to its former glory!', 'NEW: Blinding Smile (K): his handsome face blinds the enemies of evil and heals 1 heart.', 'NEW: Hair Whip (L): a spinning hair attack. And flowing hair makes him faster.'] },
};

/* ---------------- scenes ---------------- */
let scene = 'title';
let frame = 0;
let story = null, reward = null, lv = null, P = null, overT = 0, menuSel = 0, paused = false;

function startStory(def, onDone) {
  story = { def, i: 0, chars: 0, onDone };
  scene = 'story';
}
function newGame() {
  game = { chapter: 0, look: { muscles: false, handsome: false, hair: false } };
  saveGame();
  startStory(PROLOGUE, startChapterIntro);
}
function continueGame() {
  const s = loadSave(); if (!s) return newGame();
  game = s; startChapterIntro();
}
function startChapterIntro() {
  const c = CHAPTERS[game.chapter];
  startStory(Object.assign({ bg: c.theme }, c.intro), startLevel);
}

function stats() {
  const L = game.look;
  return {
    speed: L.hair ? 3.9 : L.muscles ? 2.9 : 2.4,
    dmg: L.muscles ? 3 : 1,
    maxHp: 6 + (L.muscles ? 2 : 0) + (L.handsome ? 1 : 0) + (L.hair ? 2 : 0),
    range: L.muscles ? 62 : 52,
    atkCd: L.muscles ? 16 : 22,
  };
}

function startLevel() {
  const c = CHAPTERS[game.chapter];
  const s = stats();
  P = { x: 160, y: 360, facing: 1, hp: s.maxHp, maxHp: s.maxHp, walk: 0, moving: false, atk: 0, atkCd: 0, inv: 60,
        smileCd: 0, smileT: 0, hairCd: 0, spin: 0, spinHit: new Set(), frozenT: 0, confT: 0, slowT: 0, dashT: 0, dashCd: 0, dvx: 0, dvy: 0 };
  lv = { c, phase: 'minions', spawned: 0, killed: 0, spawnT: 30, enemies: [], boss: null, proj: [], haz: [], parts: [], texts: [],
         pickups: [], shake: 0, t: 0, banner: { text: c.title, sub: c.subtitle, t: 180 }, heartT: 0, endT: 0, ultReady: false, ultT: 0, flashFx: null };
  scene = 'level'; paused = false;
}

/* ---------------- entities ---------------- */
const MINION = {
  slime: { hp: 2, speed: 1.0, r: 14 },
  bug: { hp: 3, speed: 1.8, r: 12 },
  meatball: { hp: 6, speed: 1.5, r: 14 },
  sausage: { hp: 8, speed: 1.9, r: 14 },
  zombie: { hp: 9, speed: 0.95, r: 15 },
  bat: { hp: 5, speed: 2.1, r: 12 },
  ghost: { hp: 10, speed: 1.4, r: 15 },
};
function spawnMinion(type, x, y, counted = true) {
  const d = MINION[type];
  const e = { type, x, y, hp: d.hp, maxHp: d.hp, speed: d.speed * rand(0.85, 1.15), r: d.r, t: Math.floor(rand(0, 60)),
              kx: 0, ky: 0, flash: 0, stun: 0, face: 1, hop: 0, hvx: 0, hvy: 0, z: 0, rise: 0, counted };
  lv.enemies.push(e); return e;
}
function spawnEdgeMinion() {
  const c = lv.c; const type = pick(c.minions.types);
  const left = Math.random() < 0.5;
  spawnMinion(type, left ? -20 : W + 20, rand(FLOOR_TOP + 20, FLOOR_BOT - 10));
  lv.spawned++;
}

function spawnBoss(kind) {
  const base = { kind, x: 760, y: 340, t: 0, state: 'walk', flash: 0, stun: 0, face: -1, hidden: false, alpha: 1, sink: 0, lid: 0, dying: 0,
                funkCd: 300, lsCd: 0, lsUses: 0, reachLen: 0, rdir: 0, sdir: 0, foot: 0, glow: 0, heat: 0 };
  if (kind === 'swamp') Object.assign(base, { name: 'SWAMP THING', hp: 20, r: 40 });
  if (kind === 'crock') Object.assign(base, { name: 'THE HUMAN CROCKPOT', hp: 70, r: 42, vx: 0, vy: 0 });
  if (kind === 'undertaker') Object.assign(base, { name: 'THE UNDERTAKER', hp: 160, r: 30 });
  base.maxHp = base.hp;
  lv.boss = base;
  sfx('boss'); lv.shake = 20;
  lv.banner = { text: base.name, t: 150 };
}

function proj(x, y, ang, speed, kind) {
  const p = { x, y, vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed, kind, r: 10, z: 26, life: 400, rot: 0 };
  if (kind === 'breath') { p.r = 13; p.z = 30; }
  if (kind === 'quake') { p.r = 9; p.z = 4; }
  if (kind === 'stew') { p.r = 9; }
  lv.proj.push(p);
}
function hazard(x, y, r, kind, warn, active, linger = 20) { lv.haz.push({ x, y, r, kind, warn, active, linger, t: 0 }); }

function burst(x, y, color, n = 10, spd = 3, size = 4, grav = 0.1) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), s = rand(0.3, 1) * spd;
    lv.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1, life: rand(20, 40), max: 40, color, size: rand(size * 0.5, size), grav, kind: 'c' });
  }
}
function sparkles(x, y, n = 8, color = '#fff6a8') {

}
const POWS = ['SLASH!', 'CLANG!', 'SHING!', 'WHAM!', 'SWISH!', 'THWACK!'];
function floatText(x, y, str, color = '#ffe14a', size = 20) { lv.texts.push({ x, y, str, color, size, t: 50 }); }

/* ---------------- combat ---------------- */
function hurtPlayer(d, fx, fy) {

  const a = Math.atan2(P.y - fy, P.x - fx); P.kx = Math.cos(a) * 9; P.ky = Math.sin(a) * 6;

function hitEnemy(e, dmg, fromX) {

  sfx('hit'); burst(e.x, e.y - 15, '#fff', 6, 3, 3);
  if (Math.random() < 0.35) floatText(e.x, e.y - 40, pick(POWS));

    sfx('die'); burst(e.x, e.y - 10, minionColor(e.type), 14, 4, 5);
    if (e.counted) lv.killed++;

}
function hitBoss(b, dmg, ult = false) {

  b.hp -= dmg * m; b.flash = 8; sfx('hit');
  if (b.kind === 'undertaker' && !ult) {
    if (b.hp <= b.maxHp * 0.25 && !lv.ultReady) {
      lv.ultReady = true; sfx('power'); lv.shake = 10;
      lv.banner = { text: 'ULTIMATE ABILITY UNLOCKED', sub: 'THE HANDSOME REVIVAL: press U' + (isTouch ? ' / tap ULT' : ''), t: 200 };
    }
    b.hp = Math.max(1, b.hp);
  }
  burst(b.x, b.y - 50, '#fff', 8, 4, 3);
  if (m > 1) floatText(b.x, b.y - 110, 'x2 DIZZY!', '#ff9a3a', 22);
  else if (Math.random() < 0.4) floatText(b.x + rand(-20, 20), b.y - 100, pick(POWS));
  if (b.hp <= 0) {
    b.hp = 0; b.dying = 1; lv.phase = 'bossDying'; lv.proj.length = 0; lv.haz.length = 0;
    for (const e of lv.enemies) e.hp = 0;

}
function minionColor(t) { return { slime: '#7ccf2a', bug: '#3a5a2a', meatball: '#8b4a2b', sausage: '#d0603a', zombie: '#7fae6a', bat: '#333', ghost: '#55556a' }[t]; }

function doPunch() {
  const s = stats();
  sfx('punch');
  const reach = s.range;
  const inFront = (x, y, r) => { const dx = (x - P.x) * P.facing; return dx > -10 && dx < reach + r && Math.abs(y - P.y) < 30 + r * 0.6; };
  for (const e of lv.enemies) if (e.hp > 0 && inFront(e.x, e.y, e.r)) hitEnemy(e, s.dmg, P.x);
  const b = lv.boss;
  if (b && inFront(b.x, b.y, b.r)) hitBoss(b, s.dmg);
}
function doSmile() {
  P.smileT = 50; P.smileCd = 420; sfx('smile');
  P.hp = Math.min(P.maxHp, P.hp + 1);
  floatText(P.x, P.y - 90, '*BLINDING SMILE*', '#fff6a8', 24);
  sparkles(P.x, P.y - 50, 20);
  for (const e of lv.enemies) if (dist(e, P) < 230) { e.stun = 160; e.kx = Math.sign(e.x - P.x) * 6; }
  const b = lv.boss;
  if (b && !b.hidden && dist(b, P) < 300) { b.stun = 50; floatText(b.x, b.y - 170, 'blinded!', '#ff8ac8', 22); }
}
function doUltimate() {
  lv.ultT = 1; lv.ultReady = false; P.inv = 9999; sfx('smile'); sfx('power');
  lv.proj.length = 0; lv.haz.length = 0;

}
function doHair() {

}

/* ---------------- updates ---------------- */
function moveToward(o, tx, ty, s) { const dx = tx - o.x, dy = ty - o.y, d = Math.hypot(dx, dy); if (d > 1) { o.x += dx / d * s; o.y += dy / d * s * 0.8; } if (Math.abs(dx) > 4) o.face = Math.sign(dx); }

function updatePlayer() {
  const s = stats();
  P.maxHp = s.maxHp;
  let mx = 0, my = 0;
  if (held('arrowleft', 'a')) mx -= 1; if (held('arrowright', 'd')) mx += 1;
  if (held('arrowup', 'w')) my -= 1; if (held('arrowdown', 's')) my += 1;
  if (joy.id !== null && Math.hypot(joy.dx, joy.dy) > 0.2) { mx += joy.dx; my += joy.dy; }
  const m = Math.hypot(mx, my); if (m > 1) { mx /= m; my /= m; }
  if (P.confT > 0) { P.confT--; mx = -mx; my = -my; }
  if (P.slowT > 0) P.slowT--;
  if (P.frozenT > 0) { P.frozenT--; mx = my = 0; }
  P.moving = Math.hypot(mx, my) > 0.1;
  if (P.moving) { P.walk += 0.22 * (s.speed / 2.4); if (Math.abs(mx) > 0.2) P.facing = Math.sign(mx); }
  const spd = s.speed * (P.slowT > 0 ? 0.7 : 1);
  P.x += mx * spd + (P.kx || 0); P.y += my * spd * 0.8 + (P.ky || 0);
  if (P.dashCd > 0) P.dashCd--;
  if (P.dashT > 0) { P.dashT--; P.x += P.dvx; P.y += P.dvy; if (P.dashT % 3 === 0) burst(P.x, P.y - 4, 'rgba(220,220,200,0.7)', 2, 1, 5, 0); }
  P.kx = (P.kx || 0) * 0.75; P.ky = (P.ky || 0) * 0.75;
  P.x = clamp(P.x, 20, W - 20); P.y = clamp(P.y, FLOOR_TOP, FLOOR_BOT);
  if (P.inv > 0) P.inv--; if (P.atk > 0) P.atk--; if (P.atkCd > 0) P.atkCd--;
  if (P.smileCd > 0) P.smileCd--; if (P.smileT > 0) P.smileT--; if (P.hairCd > 0) P.hairCd--;
  if (lv.phase === 'bossDying' || lv.ultT || P.frozenT > 0) return;
  if (wasPressed('u', 'btn_ult') && lv.ultReady) { doUltimate(); return; }
  if (wasPressed('shift', 'btn_dash') && P.dashCd <= 0 && P.dashT <= 0) {
    let dx = mx, dy = my; const dl = Math.hypot(dx, dy);
    if (dl < 0.1) { dx = P.facing; dy = 0; } else { dx /= dl; dy /= dl; }
    P.dashT = 11; P.dashCd = 42; P.dvx = dx * 8.5; P.dvy = dy * 7; P.inv = Math.max(P.inv, 20); P.dodging = 20; sfx('blip');
  }
  if (P.dodging > 0) P.dodging--;

  if (wasPressed(' ', 'j', 'z', 'btn_atk') && P.atkCd <= 0) { P.atk = 10; P.atkCd = s.atkCd; doPunch(); }
  if (wasPressed('k', 'x', 'btn_smile')) {
    if (!game.look.handsome) floatText(P.x, P.y - 90, 'Locked!', '#aaa', 16);
    else if (P.smileCd <= 0) doSmile();
  }
  if (wasPressed('l', 'c', 'btn_hair')) {
    if (!game.look.hair) floatText(P.x, P.y - 90, 'Locked!', '#aaa', 16);
    else if (P.hairCd <= 0) doHair();
  }
  if (P.spin > 0) {
    P.spin--;
    if (P.spin % 4 === 0) sparkles(P.x, P.y - 40, 2, '#e39b4c');
    for (const e of lv.enemies) if (e.hp > 0 && !P.spinHit.has(e) && dist(e, P) < 95 + e.r) { P.spinHit.add(e); hitEnemy(e, 5, P.x); }
    const b = lv.boss; if (b && !P.spinHit.has(b) && dist(b, P) < 95 + b.r) { P.spinHit.add(b); hitBoss(b, 5); }
  }
}

function updateEnemy(e) {
  e.t++; if (e.flash > 0) e.flash--;
  e.x += e.kx; e.y += e.ky; e.kx *= 0.8; e.ky *= 0.8;
  if (e.rise > 0) { e.rise--; return; }
  if (e.stun > 0) { e.stun--; return; }
  const dx = P.x - e.x, dy = P.y - e.y, d = Math.hypot(dx, dy) || 1;
  if (Math.abs(dx) > 3) e.face = Math.sign(dx);
  switch (e.type) {
    case 'bat': case 'bug': {
      const w = Math.sin(e.t * 0.1) * 1.8;
      e.x += dx / d * e.speed - dy / d * w; e.y += dy / d * e.speed * 0.8 + dx / d * w * 0.5; e.z = 30 + Math.sin(e.t * 0.2) * 6;
      break;
    }
    case 'ghost': {
      e.alpha = 0.55 + Math.sin(e.t * 0.05) * 0.3;
      e.x += dx / d * e.speed; e.y += dy / d * e.speed * 0.8; e.z = 10 + Math.sin(e.t * 0.08) * 6;
      break;
    }
    default: e.x += dx / d * e.speed; e.y += dy / d * e.speed * 0.8;
  }
  // separation
  for (const o of lv.enemies) {
    if (o === e || o.hp <= 0) continue;
    const ox = e.x - o.x, oy = e.y - o.y, od = Math.hypot(ox, oy);
    if (od > 0 && od < e.r + o.r) { const push = (e.r + o.r - od) * 0.05; e.x += ox / od * push; e.y += oy / od * push; }
  }
  e.x = clamp(e.x, -30, W + 30); e.y = clamp(e.y, FLOOR_TOP, FLOOR_BOT);
  if (d < e.r + 14) hurtPlayer(1, e.x, e.y);
}

function callout(b, str, color) { lv.texts.push({ x: clamp(b.x, 150, W - 150), y: Math.max(118, b.y - 240), str, color, size: 26, t: 90 }); }
function drainPlayer(why) {
  if (P.hp <= 0 || lv.ultT) return;
  P.hp -= 1; sfx('hurt'); floatText(P.x, P.y - 95, why, '#ff9a5a', 18);
  if (P.hp <= 0) { P.hp = 0; scene = 'gameover'; overT = 0; sfx('lose'); }
}
function segDist(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1, l2 = dx * dx + dy * dy || 1;
  const k = clamp(((px - x1) * dx + (py - y1) * dy) / l2, 0, 1);
  return Math.hypot(px - (x1 + dx * k), py - (y1 + dy * k));
}
function bell() { [196, 196, 147].forEach((f, i) => { tone(f, 1.2, 'triangle', 0.12, null, i * 0.5); tone(f * 2.01, 0.8, 'sine', 0.05, null, i * 0.5); }); }

function touching(b) { return P.inv <= 0 && dist(b, P) < b.r * 0.55 + 12; }
function bump(b, d) { hurtPlayer(d, b.x, b.y); P.kx *= 1.6; P.ky *= 1.6; b.pause = 55; }
function updateBoss(b) {
  if (b.flash > 0) b.flash--;
  if (b.pause > 0) b.pause--;
  if (b.dying) { b.dying++; if (b.dying % 6 === 0) burst(b.x + rand(-30, 30), b.y - rand(10, 90), pick(['#fff', '#ffd34d', '#ff6a3a']), 6, 4, 5); return; }
  if (lv.ultT) return;
  const rage = b.hp < b.maxHp * 0.5;
  if (b.stun > 0) { b.stun--; b.reachLen = 0; if (b.stun % 15 === 0) lv.parts.push({ x: b.x + rand(-20, 20), y: b.y - 150, vx: 0, vy: -1, life: 40, max: 40, color: '#ff6fb5', size: 9, grav: 0, kind: 'h' }); return; }
  b.t++;
  const p = P, aim = Math.atan2(p.y - b.y, p.x - b.x);
  const done = n => { if (b.t > n) { b.state = 'walk'; b.t = 0; b.glow = 0; } };

  if (b.kind === 'swamp') {
    if (b.funkCd > 0) b.funkCd--;
    switch (b.state) {
      case 'walk':
        if (!b.pause) moveToward(b, p.x, p.y, rage ? 1.3 : 0.9);
        if (b.t > (rage ? 75 : 105)) {
          const opts = ['breath', 'breath', 'cloud', 'cloud']; if (b.funkCd <= 0) opts.push('funk', 'funk');
          b.state = pick(opts); b.t = 0;
        }
        break;
      case 'breath':
        b.face = Math.sign(p.x - b.x) || 1;
        if (b.t === 1) callout(b, 'SWAMP BREATH!', '#b6f04a');
        if (b.t === 30 || (rage && b.t === 58)) {
          const n = rage ? 5 : 3; for (let i = 0; i < n; i++) proj(b.x, b.y, aim + (i - (n - 1) / 2) * 0.28, rage ? 3.6 : 3.1, 'breath');
          sfx('splat');
        }
        done(80); break;
      case 'cloud':
        if (b.t === 1) callout(b, 'TOXIC CLOUD!', '#b6f04a');
        if (b.t === 15) {
          const n = rage ? 4 : 2;
          for (let i = 0; i < n; i++) hazard(clamp(p.x + (i ? rand(-170, 170) : 0), 40, W - 40), clamp(p.y + (i ? rand(-100, 100) : 0), FLOOR_TOP, FLOOR_BOT), 50, 'stink', 45 + i * 10, 90, 25);
        }
        done(60); break;
      case 'funk':
        if (b.t === 1) { callout(b, 'THE FUNK BOMB!', '#e6ff3a'); sfx('boss'); }
        b.glow = Math.min(1, b.t / 70);
        if (b.t === 70 || (rage && b.t === 88)) {
          const n = rage ? 14 : 10, off = b.t === 88 ? Math.PI / n : 0;
          for (let i = 0; i < n; i++) proj(b.x, b.y, off + i / n * TAU, 3, 'breath');
          if (b.t === 70) {
            lv.shake = 20; sfx('boom'); lv.flashFx = { color: '150,230,40', t: 30 };
            for (const e of lv.enemies) if (e.hp > 0) { e.hp = 0; burst(e.x, e.y - 10, '#9c3', 8); }
            floatText(b.x, b.y - 160, 'Battlefield... cleared.', '#e6ff3a', 18);
          }
        }
        if (b.t > 90) { b.funkCd = 420; b.glow = 0; }
        done(100); break;
    }
    if (touching(b)) bump(b, 1);
  }
  else if (b.kind === 'crock') {
    if (b.lsCd > 0) b.lsCd--;
    switch (b.state) {
      case 'walk':
        b.lid = Math.max(0, b.lid - 1);
        if (!b.pause) moveToward(b, p.x, p.y, rage ? 1.3 : 0.9);
        if (b.t > (rage ? 75 : 100)) {
          const opts = ['slow', 'pressure', 'season', 'season', 'charge', 'charge'];
          if (b.hp < b.maxHp * 0.7 && b.lsCd <= 0 && b.lsUses < 2) opts.push('lowslow', 'lowslow');
          b.state = pick(opts); b.t = 0;
        }
        break;
      case 'slow':
        if (b.t === 1) callout(b, 'SLOW COOK!', '#ff7a3a');
        moveToward(b, p.x, p.y, 0.45);
        b.heat = b.t < 30 ? 0 : 1;
        if (b.t >= 30 && dist(b, p) < 170 && (b.t - 30) % 55 === 54) drainPlayer('slow cooked...');
        if (b.t > 200) b.heat = 0;
        done(200); break;
      case 'pressure':
        if (b.t === 1) callout(b, 'PRESSURE RELEASE!', '#ffffff');
        b.lid = b.t < 20 ? b.t : Math.max(0, 20 - (b.t - 50));
        if (b.t === 10) {
          const n = rage ? 5 : 3;
          hazard(clamp(p.x, 40, W - 40), clamp(p.y, FLOOR_TOP, FLOOR_BOT), 46, 'steam', 45, 60);
          for (let i = 1; i < n; i++) hazard(clamp(p.x + rand(-160, 160), 40, W - 40), clamp(p.y + rand(-100, 100), FLOOR_TOP, FLOOR_BOT), 46, 'steam', 45 + i * 8, 60);
        }
        if (b.t === 30 || (rage && b.t === 55)) {
          const n = rage ? 14 : 10, off = b.t === 55 ? Math.PI / n : 0;
          for (let i = 0; i < n; i++) proj(b.x, b.y - 10, off + i / n * TAU, 3.1, 'stew');
          sfx('boom'); lv.shake = 8;
          for (let i = 0; i < 8; i++) lv.parts.push({ x: b.x + rand(-25, 25), y: b.y - 100, vx: rand(-0.6, 0.6), vy: -1.6, life: 50, max: 50, color: 'rgba(255,255,255,0.75)', size: 12, grav: -0.01, kind: 'c' });
        }
        done(80); break;
      case 'season':
        b.face = Math.sign(p.x - b.x) || 1;
        if (b.t === 1) callout(b, 'EXTRA SEASONING!', '#e0a050');
        if (b.t === 20 || b.t === 40 || (rage && b.t === 60)) {
          for (let i = -1; i <= 1; i++) proj(b.x, b.y - 10, aim + i * 0.25, 3.8, 'spice');
          sfx('punch');
        }
        done(80); break;
      case 'charge':
        if (b.t < 40) { b.cdir = aim; b.face = Math.sign(p.x - b.x) || 1; }
        if (b.t === 45) sfx('boss');
        if (b.t > 45) {
          const sp = rage ? 10 : 8.5;
          b.x += Math.cos(b.cdir) * sp; b.y += Math.sin(b.cdir) * sp * 0.8;
          if (b.t % 3 === 0) burst(b.x, b.y, '#bbb', 2, 1, 4, 0);
          const hitWall = b.x < 50 || b.x > W - 50 || b.y < FLOOR_TOP + 15 || b.y > FLOOR_BOT - 5;
          if (hitWall || b.t > 110) {
            b.x = clamp(b.x, 50, W - 50); b.y = clamp(b.y, FLOOR_TOP + 15, FLOOR_BOT - 5);
            b.state = hitWall ? 'dizzy' : 'walk'; b.t = 0;
            if (hitWall) { lv.shake = 18; sfx('boom'); burst(b.x, b.y - 40, '#ffd34d', 12, 4, 4); }
          }
        }
        break;
      case 'dizzy':
        done(rage ? 70 : 95); break;
      case 'lowslow':
        if (b.t === 1) { callout(b, 'LOW AND SLOW!', '#ff9a3a'); floatText(clamp(b.x, 150, W - 150), Math.max(140, b.y - 214), '(this battle may take 12 hours)', '#fff', 15); b.lsUses = (b.lsUses || 0) + 1; }
        if (b.t % 6 === 0 && b.t <= 60) { b.hp = Math.min(b.maxHp, b.hp + 1); lv.parts.push({ x: b.x + rand(-25, 25), y: b.y - 90, vx: 0, vy: -1.2, life: 40, max: 40, color: 'rgba(255,255,255,0.7)', size: 10, grav: 0, kind: 'c' }); }
        if (b.t > 60) b.lsCd = 600;
        done(75); break;
    }
    b.x = clamp(b.x, 50, W - 50); b.y = clamp(b.y, FLOOR_TOP + 15, FLOOR_BOT - 5);
    if (b.state !== 'dizzy' && touching(b)) bump(b, b.state === 'charge' ? 2 : 1);
  }
  else if (b.kind === 'undertaker') {
    const minions = lv.enemies.filter(e => e.hp > 0).length;
    switch (b.state) {
      case 'walk':
        b.reachLen = 0; b.foot = 0;
        if (!b.pause) moveToward(b, p.x, p.y, rage ? 1.4 : 1.05);
        if (b.t > (rage ? 45 : 65)) {
          const opts = ['stare', 'reach', 'reach', 'stomp', 'stomp']; if (minions < 3) opts.push('bell');

        }
        break;
      case 'stare':
        if (b.t === 1) callout(b, 'GRAVEYARD STARE!', '#c69bff');
        if (b.t < 30) { b.sdir = aim; b.face = Math.sign(p.x - b.x) || 1; }
        if (b.t === 55) {
          let da = Math.abs(Math.atan2(p.y - b.y, p.x - b.x) - b.sdir); if (da > Math.PI) da = TAU - da;

        }
        done(80); break;
      case 'reach':
        if (b.t === 1) { callout(b, 'THE LONG REACH!', '#c69bff'); floatText(clamp(b.x, 150, W - 150), Math.max(140, b.y - 214), '(from three business days away)', '#fff', 14); }
        if (b.t < 35) { b.rdir = aim; b.face = Math.sign(p.x - b.x) || 1; }
        if (b.t >= 45 && b.t < 55) b.reachLen = (b.t - 44) * 75;
        if (b.t >= 55 && b.t < 62) {
          const hx = b.x + Math.cos(b.rdir) * b.reachLen, hy = b.y + Math.sin(b.rdir) * b.reachLen;

        }
        if (b.t === 45) sfx('hair');
        if (b.t >= 62) b.reachLen = Math.max(0, b.reachLen - 70);
        done(80); break;
      case 'stomp':
        if (b.t === 1) callout(b, 'TOE-LESS TERROR!', '#c69bff');
        b.foot = b.t < 30 ? b.t / 30 : 0;
        if (b.t === 30 || (rage && b.t === 58)) {
          const n = rage ? 16 : 12, off = b.t === 58 ? Math.PI / n : 0;
          for (let i = 0; i < n; i++) proj(b.x, b.y, off + i / n * TAU, 4, 'quake');

        }
        done(85); break;
      case 'bell':
        if (b.t === 1) { callout(b, 'THE FINAL BELL!', '#c69bff'); bell(); }
        if (b.t === 40) {
          const n = rage ? 3 : 2;
          for (let i = 0; i < n; i++) { const g = spawnMinion('ghost', clamp(b.x + rand(-160, 160), 40, W - 40), clamp(b.y + rand(-90, 90), FLOOR_TOP + 10, FLOOR_BOT), false); g.rise = 30; burst(g.x, g.y - 20, '#e8f0ff', 10, 2, 4); }
        }
        done(80); break;
    }
    b.x = clamp(b.x, 50, W - 50); b.y = clamp(b.y, FLOOR_TOP + 15, FLOOR_BOT - 5);
    if (touching(b)) bump(b, 1);

function updateLevel() {
  if (wasPressed('p', 'escape')) paused = !paused;
  if (paused) { if (tapped) paused = false; return; }
  lv.t++;
  if (lv.banner.t > 0) lv.banner.t--;
  if (lv.shake > 0) lv.shake--;
  updatePlayer();
  if (scene !== 'level') return;

  // minion phase spawning
  if (lv.phase === 'minions') {
    const alive = lv.enemies.filter(e => e.hp > 0).length;
    if (--lv.spawnT <= 0 && lv.spawned < lv.c.minions.count && alive < lv.c.minions.max) { spawnEdgeMinion(); lv.spawnT = rand(35, 75); }
    if (lv.killed >= lv.c.minions.count) {
      lv.phase = 'cleared'; lv.endT = 0;
    }
  }
  if (lv.phase === 'cleared') {
    lv.endT++;
    if (lv.endT === 50) {
      const c = lv.c;
      if (c.boss) {
        lv.proj.length = 0; lv.haz.length = 0;
        startStory(Object.assign({ bg: c.theme }, c.bossIntro), () => { scene = 'level'; lv.phase = 'boss'; spawnBoss(c.boss); });
      }
    }
  }
  if (lv.flashFx && --lv.flashFx.t <= 0) lv.flashFx = null;
  if (lv.ultT) {
    lv.ultT++;
    if (lv.ultT % 3 === 0) sparkles(P.x, P.y - 60, 3);
    if (lv.ultT === 70 && lv.boss) { lv.boss.stun = 0; hitBoss(lv.boss, 99999, true); }
  }

  for (const e of lv.enemies) if (e.hp > 0) updateEnemy(e);
  lv.enemies = lv.enemies.filter(e => e.hp > 0);

  const b = lv.boss;
  if (b) {
    updateBoss(b);
    if (lv.phase === 'boss' && P.hp < P.maxHp && ++lv.heartT > 420) { lv.heartT = 0; lv.pickups.push({ x: rand(100, W - 100), y: rand(FLOOR_TOP + 30, FLOOR_BOT - 20), t: 0 }); }
    if (b.dying > 110) {
      const c = lv.c; lv.boss = null; lv.phase = 'done';
      startStory(Object.assign({ bg: c.theme }, c.outro), () => {
        if (!c.reward) { startStory(ENDING, () => { scene = 'victory'; overT = 0; clearSave(); sfx('win'); }); return; }
        const before = Object.assign({}, game.look);
        if (c.reward === 'restore') { game.look.handsome = true; game.look.hair = true; } else game.look[c.reward] = true;
        reward = { kind: c.reward, before, after: Object.assign({}, game.look), t: 0 };
        scene = 'reward'; sfx('power');
      });
      return;
    }
  }

  for (const p of lv.proj) {
    p.x += p.vx; p.y += p.vy; p.life--; p.rot += 0.15;
    if (dist(p, P) < p.r * 0.7 + 9 && P.inv <= 0) {
      hurtPlayer(1, p.x, p.y); p.life = 0;
      burst(p.x, p.y - p.z, { breath: '#9c3', stew: '#ff7a1a', spice: '#a0662a', quake: '#6b5a4a' }[p.kind] || '#888', 6);
      if (p.kind === 'breath') { P.slowT = 80; floatText(P.x, P.y - 110, 'MORALE: ZERO', '#b6f04a', 18); }
      if (p.kind === 'spice') { P.confT = 120; floatText(P.x, P.y - 110, 'CONFUSED & NAUSEOUS!', '#e0a050', 18); }
      if (p.kind === 'quake') { P.slowT = 90; floatText(P.x, P.y - 110, 'TERRIFIED!', '#c69bff', 18); }
    }
    if (p.x < -40 || p.x > W + 40 || p.y < FLOOR_TOP - 60 || p.y > H + 30) p.life = 0;
  }
  lv.proj = lv.proj.filter(p => p.life > 0);

  for (const h of lv.haz) {
    h.t++;
    if (h.t === h.warn) { if (h.kind === 'stink') sfx('splat'); if (h.kind === 'coffin') { lv.shake = 10; sfx('boom'); burst(h.x, h.y, '#6b5a4a', 10, 3, 5); } if (h.kind === 'steam') sfx('splat'); }
    if (h.t >= h.warn && h.t < h.warn + h.active) {
      const dx = P.x - h.x, dy = (P.y - h.y) * 1.6;
      if (Math.hypot(dx, dy) < h.r) hurtPlayer(1, h.x, h.y);
      if (h.kind === 'steam' && h.t % 6 === 0) lv.parts.push({ x: h.x + rand(-h.r * 0.7, h.r * 0.7), y: h.y, vx: rand(-0.3, 0.3), vy: -1.5, life: 40, max: 40, color: 'rgba(255,255,255,0.65)', size: rand(10, 16), grav: -0.01, kind: 'c' });
    }
  }
  lv.haz = lv.haz.filter(h => h.t < h.warn + h.active + h.linger);

  for (const k of lv.pickups) {
    k.t++;
    if (dist(k, P) < 26) { k.t = 9999; P.hp = Math.min(P.maxHp, P.hp + 1); sfx('pickup'); floatText(k.x, k.y - 30, '+1', '#ff6a8a'); }
  }
  lv.pickups = lv.pickups.filter(k => k.t < 600);

  for (const p of lv.parts) { p.x += p.vx; p.y += p.vy; p.vy += p.grav; p.life--; }
  lv.parts = lv.parts.filter(p => p.life > 0);
  for (const t of lv.texts) { t.t--; t.y -= 0.8; }
  lv.texts = lv.texts.filter(t => t.t > 0);
}

/* ---------------- main update ---------------- */
function update() {
  frame++;
  if (wasPressed('m')) muted = !muted;
  switch (scene) {
    case 'title': {
      const hasSave = !!loadSave();
      const n = hasSave ? 2 : 1;
      if (wasPressed('arrowup', 'w', 'arrowdown', 's')) { menuSel = (menuSel + 1) % n; sfx('blip'); }
      if (!hasSave) menuSel = 0;
      if (tapped) {
        if (hasSave && tapped.y > 405 && tapped.y < 445) menuSel = 1;
        else if (tapped.y > 355 && tapped.y < 395) menuSel = 0;
        else { tapped = false; break; }
      }
      if (confirmPressed()) { sfx('pickup'); if (menuSel === 1 && hasSave) continueGame(); else newGame(); }
      break;
    }
    case 'story': {
      const pg = story.def.pages[story.i];
      if (story.chars < pg.text.length) { story.chars += 1.4; if (frame % 3 === 0) sfx('blip'); }
      if (confirmPressed()) {
        if (story.chars < pg.text.length) story.chars = pg.text.length;
        else { story.i++; story.chars = 0; if (story.i >= story.def.pages.length) { const cb = story.onDone; story = null; cb(); } }
      }
      break;
    }
    case 'level': updateLevel(); break;
    case 'reward':
      reward.t++;
      if (reward.t > 60 && confirmPressed()) { game.chapter++; saveGame(); startChapterIntro(); }
      break;
    case 'gameover':
      overT++;
      if (overT > 60 && confirmPressed()) startLevel();
      break;
    case 'victory':
      overT++;
      if (overT > 90 && confirmPressed()) { scene = 'title'; menuSel = 0; }
      break;
  }
}

  else if (p.kind === 'breath') { for (let i = 0; i < 3; i++) circ(p.x + Math.cos(p.rot + i * 2.1) * 5, y + Math.sin(p.rot + i * 2.1) * 4, p.r * 0.75, 'rgba(150,225,40,0.55)'); fly(p.x + Math.cos(p.rot * 2) * 9, y - 8, frame); }
  else if (p.kind === 'quake') { ctx.save(); ctx.translate(p.x, y); ctx.rotate(p.rot); poly([-8, 4, -5, -6, 3, -8, 9, -1, 5, 6], '#6b5a4a'); ctx.restore(); circ(p.x - p.vx * 3, y + 2, 5, 'rgba(140,120,100,0.4)'); }
}
function drawHazard(h) {
  const warn = h.t < h.warn, act = h.t >= h.warn && h.t < h.warn + h.active;
  const k = warn ? h.t / h.warn : 1;
  if (h.kind === 'puddle') {
    ell(h.x, h.y, h.r * k, h.r * 0.45 * k, warn ? 'rgba(30,60,30,0.75)' : 'rgba(60,110,50,0.8)');
    if (warn && frame % 20 < 10) ell(h.x, h.y, h.r * k * 0.5, h.r * 0.2 * k, 'rgba(120,180,90,0.5)');
  } else if (h.kind === 'steam') {
    ctx.save(); ctx.strokeStyle = warn ? `rgba(255,80,40,${0.4 + 0.4 * Math.sin(frame * 0.4)})` : 'rgba(255,255,255,0.6)'; ctx.lineWidth = 3; ctx.setLineDash([8, 6]);
    ctx.beginPath(); ctx.ellipse(h.x, h.y, h.r, h.r * 0.6, 0, 0, TAU); ctx.stroke(); ctx.restore();
    if (act) ell(h.x, h.y, h.r, h.r * 0.6, 'rgba(255,255,255,0.25)');
    if (!warn && !act) ell(h.x, h.y, h.r * 0.8, h.r * 0.5, `rgba(255,255,255,${0.2 * (1 - (h.t - h.warn - h.active) / h.linger)})`);
  } else if (h.kind === 'stink') {
    const fade = act ? 1 : warn ? 0 : Math.max(0, 1 - (h.t - h.warn - h.active) / h.linger);
    if (warn) { ctx.save(); ctx.strokeStyle = `rgba(160,230,40,${0.4 + 0.4 * Math.sin(frame * 0.4)})`; ctx.lineWidth = 3; ctx.setLineDash([8, 6]); ctx.beginPath(); ctx.ellipse(h.x, h.y, h.r, h.r * 0.6, 0, 0, TAU); ctx.stroke(); ctx.restore(); }
    else {
      for (let i = 0; i < 5; i++) { const a = frame * 0.03 + i * 1.26; ell(h.x + Math.cos(a) * h.r * 0.45, h.y - 18 + Math.sin(a) * 10, h.r * 0.55, h.r * 0.35, `rgba(150,225,40,${0.28 * fade})`); }
      for (let i = 0; i < 3; i++) { const a = frame * 0.09 + i * 2.1; fly(h.x + Math.cos(a) * h.r * 0.6, h.y - 30 + Math.sin(a * 1.4) * 12, frame + i * 5); }
    }
  } else if (h.kind === 'coffin') {
    if (warn) {
      ell(h.x, h.y, h.r * k, h.r * 0.5 * k, 'rgba(0,0,0,0.45)');
      ctx.save(); ctx.strokeStyle = 'rgba(200,120,255,0.8)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(h.x, h.y, h.r, h.r * 0.5, 0, 0, TAU); ctx.stroke(); ctx.restore();
      if (h.warn - h.t < 18) drawCoffin(h.x, h.y - (h.warn - h.t) * 22);
    } else {
      ctx.save(); ctx.globalAlpha = act ? 1 : Math.max(0, 1 - (h.t - h.warn - h.active) / h.linger); drawCoffin(h.x, h.y); ctx.restore();
    }
  }
}
function drawCoffin(x, y) {
  poly([x - 12, y - 64, x + 12, y - 64, x + 20, y - 46, x + 14, y, x - 14, y, x - 20, y - 46], '#4a2e1a');
  poly([x - 9, y - 60, x + 9, y - 60, x + 15, y - 46, x + 10, y - 4, x - 10, y - 4, x - 15, y - 46], '#5e3a22');
  line(x, y - 52, x, y - 26, '#c8a860', 3); line(x - 7, y - 44, x + 7, y - 44, '#c8a860', 3);
}

function renderLevel() {
  ctx.save();
  if (lv.shake > 0) ctx.translate(rand(-1, 1) * lv.shake * 0.5, rand(-1, 1) * lv.shake * 0.5);
  drawBgLive(lv.c.theme);
  for (const h of lv.haz) if (h.kind !== 'coffin' || h.t < h.warn) drawHazard(h);
  for (const k of lv.pickups) { if (k.t > 480 && k.t % 10 < 5) continue; ell(k.x, k.y, 10, 4, 'rgba(0,0,0,0.3)'); heart(k.x, k.y - 26 + Math.sin(frame * 0.1) * 3, 18, '#ff3e5f'); }

  // depth sorted drawables
  const list = [];
  for (const e of lv.enemies) list.push({ y: e.y, d: () => drawMinion(e) });
  if (lv.boss) list.push({ y: lv.boss.y, d: () => drawBossEntity(lv.boss) });
  for (const h of lv.haz) if (h.kind === 'coffin' && h.t >= h.warn) list.push({ y: h.y, d: () => drawHazard(h) });
  list.push({ y: P.y, d: () => {
    ell(P.x, P.y, 16, 5, 'rgba(0,0,0,0.35)');
    if (P.inv > 0 && !P.dodging && P.inv % 8 < 4 && scene === 'level') return;
    if (P.smileT > 0) circ(P.x, P.y - 50, 60 + (50 - P.smileT) * 3, `rgba(255,240,160,${P.smileT / 50 * 0.25})`);
    if (P.frozenT > 0) ctx.filter = 'grayscale(1) brightness(1.1) sepia(0.4) hue-rotate(220deg)';
    drawStephen(P.x, P.y, P.facing, game.look, { s: 1.3, walk: P.walk, moving: P.moving, atk: P.atk, spin: P.spin, sparkle: P.smileT > 0 || lv.ultT > 0 });
    ctx.filter = 'none';
    if (P.atk > 3) {
      ctx.save(); ctx.translate(P.x, P.y - 55); ctx.scale(P.facing, 1);
      ctx.strokeStyle = game.look.hair ? `rgba(200,235,255,${P.atk / 10})` : `rgba(255,255,255,${P.atk / 12})`; ctx.lineWidth = 6; ctx.lineCap = 'round';
      const a0 = -1.2 + (10 - P.atk) * 0.25; ctx.beginPath(); ctx.arc(10, 0, stats().range * 0.85, a0, a0 + 1.2); ctx.stroke(); ctx.restore();
    }
    if (P.frozenT > 0) text('FROZEN', P.x, P.y - 110, 16, '#c69bff', 'center', 'bold', '#000');
    if (P.confT > 0) for (let i = 0; i < 3; i++) { const a = frame * 0.12 + i * TAU / 3; circ(P.x + Math.cos(a) * 18, P.y - 105 + Math.sin(a) * 5, 3, '#9c3'); }
    if (P.slowT > 0) text('...', P.x + 18, P.y - 100, 18, '#b6f04a', 'center', 'bold', '#000');
  } });
  for (const p of lv.proj) list.push({ y: p.y, d: () => drawProj(p) });
  list.sort((a, b) => a.y - b.y).forEach(o => o.d());

  for (const p of lv.parts) {
    const a = Math.max(0, p.life / p.max);
    ctx.globalAlpha = a;
    if (p.kind === 's') star(p.x, p.y, p.size, p.color, p.rot + frame * 0.05);
    else if (p.kind === 'h') heart(p.x, p.y, p.size, p.color);
    else circ(p.x, p.y, p.size, p.color);
    ctx.globalAlpha = 1;
  }
  for (const t of lv.texts) { ctx.globalAlpha = Math.min(1, t.t / 20); text(t.str, t.x, t.y, t.size, t.color, 'center', 'bold', '#000'); ctx.globalAlpha = 1; }
  ctx.restore();
  if (P.confT > 0) rr(0, 0, W, H, 0, `rgba(140,200,40,${0.06 + 0.04 * Math.sin(frame * 0.15)})`);
  if (lv.flashFx) rr(0, 0, W, H, 0, `rgba(${lv.flashFx.color},${lv.flashFx.t / 30 * 0.6})`);
  if (lv.ultT) {
    const k = lv.ultT;
    const r = Math.min(1200, k * 18);
    const g = ctx.createRadialGradient(P.x, P.y - 60, 0, P.x, P.y - 60, r);
    g.addColorStop(0, `rgba(255,255,255,${Math.min(1, k / 50)})`); g.addColorStop(0.6, `rgba(255,240,160,${Math.min(0.85, k / 60)})`); g.addColorStop(1, 'rgba(255,230,120,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    if (k > 20) { ctx.save(); ctx.translate(P.x, P.y - 60); for (let i = 0; i < 18; i++) { ctx.rotate(TAU / 18 + 0.002 * k); ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-25, -900); ctx.lineTo(25, -900); ctx.fill(); } ctx.restore(); }
    text('THE HANDSOME REVIVAL!', W / 2, 140, 46, '#ffe14a', 'center', 'bold', '#5a3a00');
  }

  drawHud();
  if (lv.banner.t > 0) {
    const a = Math.min(1, lv.banner.t / 30, (180 - lv.banner.t) / 20 + 0.2);
    ctx.globalAlpha = Math.max(0, a);
    rr(0, H / 2 - 50, W, 100, 0, 'rgba(0,0,0,0.55)');
    text(lv.banner.text, W / 2, H / 2 - (lv.banner.sub ? 12 : 0), 40, '#ffe14a', 'center', 'bold', '#000');
    if (lv.banner.sub) text(lv.banner.sub, W / 2, H / 2 + 28, 22, '#fff', 'center', 'bold', '#000');
    ctx.globalAlpha = 1;
  }
  if (lv.ultReady && !lv.ultT && lv.banner.t <= 0) text(isTouch ? 'Tap ULT: THE HANDSOME REVIVAL!' : 'Press U: THE HANDSOME REVIVAL!', W / 2, H - 40, 28 + Math.sin(frame * 0.2) * 3, '#ffe14a', 'center', 'bold', '#000');
  if (lv.phase === 'cleared' && lv.c.boss) text('Something big is coming...', W / 2, H / 2 + 70, 24, '#fff', 'center', 'bold', '#000');
  drawTouch();
  if (paused) { rr(0, 0, W, H, 0, 'rgba(0,0,0,0.6)'); text('PAUSED', W / 2, H / 2 - 10, 50, '#fff'); text('press P to resume', W / 2, H / 2 + 40, 18, '#ccc', 'center', 'normal'); }
}

function drawCharacter(id, x, y, o) {
  if (id === 'stephen') drawStephen(x, y, o.face || 1, game.look, { s: o.s, sparkle: o.sparkle });
  else if (id === 'nicky') drawNicky(x, y, o);
  else if (id === 'swamp') drawSwamp(x, y, o);
  else if (id === 'crock') drawCrock(x, y, o);
  else if (id === 'undertaker') drawUndertaker(x, y, o);
}
const SPEAKER_ID = { 'Stephen': 'stephen', 'Nicky': 'nicky', 'Swamp Thing': 'swamp', 'Human Crockpot': 'crock', 'The Undertaker': 'undertaker' };
const SPEAKER_COLOR = { 'Prophecy': '#ffd34d', 'Narrator': '#c8c8ff', 'Stephen': '#7fd0ff', 'Nicky': '#ff9ad0', 'Swamp Thing': '#8fdc7a', 'Human Crockpot': '#ff9a5a', 'The Undertaker': '#c69bff' };

function renderStory() {
  const d = story.def, pg = d.pages[story.i];
  drawBgLive(d.bg);
  rr(0, 0, W, H, 0, 'rgba(0,0,0,0.25)');
  const speaker = SPEAKER_ID[pg.who];
  const dim = (id) => { ctx.filter = (pg.who === 'Narrator' || pg.who === 'Prophecy' || speaker === id) ? 'none' : 'brightness(0.55)'; };
  dim('stephen');
  ell(250, 380, 50, 12, 'rgba(0,0,0,0.35)');
  drawStephen(250, 380, 1, game.look, { s: 2.6, sparkle: game.look.handsome && speaker === 'stephen' && story.chars < 5 });
  ctx.filter = 'none';
  if (d.right) {
    const r = d.right;
    dim(r);
    ell(720, 380, 70, 14, 'rgba(0,0,0,0.35)');
    if (r === 'nicky') { if (d.bg === 'kingdom') { drawNicky(720, 380, { s: 2.6, help: true }); drawCage(720, 380, 0); } else drawNicky(720, 380, { s: 2.6, happy: !!d.happy, help: !d.happy }); }
    else drawCharacter(r, 720, 380, { s: 1.75, face: -1, defeated: d.defeated });
    ctx.filter = 'none';
  }
  rr(30, 395, W - 60, 130, 14, 'rgba(10,10,25,0.88)');
  ctx.strokeStyle = SPEAKER_COLOR[pg.who] || '#fff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.roundRect(30, 395, W - 60, 130, 14); ctx.stroke();
  rr(50, 380, 200, 32, 8, SPEAKER_COLOR[pg.who] || '#fff');
  text(pg.who, 150, 396, 18, '#111');
  const shown = pg.text.slice(0, Math.floor(story.chars));
  const lines = wrap(shown, W - 120, 21);
  lines.forEach((l, i) => text(l, 60, 432 + i * 27, 21, '#fff', 'left', 'bold'));
  if (story.chars >= pg.text.length && frame % 50 < 35) text('▶ Enter / tap', W - 60, 508, 14, '#aaa', 'right', 'normal');
}

function renderReward() {
  const r = reward, R = REWARDS[r.kind];
  drawBgLive(CHAPTERS[game.chapter].theme);
  rr(0, 0, W, H, 0, 'rgba(0,0,0,0.65)');
  ctx.save(); ctx.translate(640, 330);
  for (let i = 0; i < 16; i++) { ctx.rotate(TAU / 16); ctx.fillStyle = i % 2 ? 'rgba(255,220,80,0.18)' : 'rgba(255,255,255,0.08)'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-40, -400); ctx.lineTo(40, -400); ctx.fill(); }
  ctx.restore();
  const pop = Math.min(1, r.t / 30);
  text(R.title, W / 2, 60, 40 * (0.6 + 0.4 * pop), '#ffe14a', 'center', 'bold', '#000');
  ell(300, 390, 40, 10, 'rgba(0,0,0,0.4)'); ell(640, 390, 50, 12, 'rgba(0,0,0,0.4)');
  ctx.filter = 'grayscale(0.7) brightness(0.8)'; drawStephen(300, 390, 1, r.before, { s: 2.6 }); ctx.filter = 'none';
  text('BEFORE', 300, 420, 18, '#aaa');
  const flash = r.t < 40 ? (r.t % 8 < 4) : false;
  drawStephen(640, 390, -1, flash ? r.before : r.after, { s: 3.1, sparkle: true });
  text('AFTER', 640, 420, 18, '#ffe14a');
  text('➜', 470, 300, 50, '#fff');
  for (let i = 0; i < 6; i++) { const a = frame * 0.03 + i * TAU / 6; star(640 + Math.cos(a) * 120, 290 + Math.sin(a) * 120, 8 + Math.sin(frame * 0.1 + i) * 3, '#fff6a8', frame * 0.05); }
  R.lines.forEach((l, i) => text(l, W / 2, 460 + i * 24, 18, '#fff', 'center', 'bold', '#000'));
  if (r.t > 60 && frame % 50 < 35) text('▶ Enter / tap to continue', W - 20, 525, 14, '#ccc', 'right', 'normal');
}

function renderTitle() {
  drawBgLive('kingdom');
  const t = frame;
  text('STEPHEN', W / 2, 78 + Math.sin(t * 0.04) * 4, 84, '#ffe14a', 'center', 'bold', '#3a1a4a');
  text('THE LEGEND OF THE RESCUE', W / 2, 146, 32, '#fff', 'center', 'bold', '#3a1a4a');
  text('An epic tale of courage, questionable hygiene, and the return of greatness.', W / 2, 186, 17, '#ffe9c8', 'center', 'bold', '#3a1a4a');
  ell(190, 470, 40, 10, 'rgba(0,0,0,0.35)');
  drawStephen(190, 470, 1, { muscles: false, handsome: false, hair: false }, { s: 2.6 });
  text('?', 240, 280, 40, '#fff', 'center', 'bold', '#000');
  drawNicky(686, 375, { s: 1.2, help: true }); drawCage(686, 375, 0);
  const hasSave = !!loadSave();
  const items = hasSave ? ['NEW GAME', 'CONTINUE (' + (loadSave().chapter === 2 ? 'Final Quest' : 'Quest ' + (loadSave().chapter + 1)) + ')'] : ['START ADVENTURE'];
  items.forEach((it, i) => {
    const y = 375 + i * 50, sel = i === menuSel;
    rr(W / 2 - 160, y - 20, 320, 40, 10, sel ? 'rgba(255,225,74,0.95)' : 'rgba(0,0,0,0.45)');
    text(it, W / 2, y, 20, sel ? '#2a1a3a' : '#fff');
  });
  text('Move: Arrows/WASD   Sword: Space/J   Dodge: Shift   Smile: K   Hair: L   Ultimate: U   Pause: P   Mute: M', W / 2, 520, 14, 'rgba(255,255,255,0.85)', 'center', 'normal', 'rgba(0,0,0,0.6)');
}

function renderGameOver() {
  renderLevel();
  rr(0, 0, W, H, 0, `rgba(20,0,0,${Math.min(0.75, overT / 60)})`);
  text('STEPHEN FAINTED...', W / 2, H / 2 - 40, 54, '#ff5a5a', 'center', 'bold', '#000');
  text('"Just... five more minutes..."', W / 2, H / 2 + 10, 22, '#fff', 'center', 'bold', '#000');
  if (overT > 60) text('Press Enter / tap to try this quest again', W / 2, H / 2 + 60, 20, '#ffe14a', 'center', 'bold', '#000');
}

function renderVictory() {
  drawBgLive('kingdom');
  const t = frame;
  for (let i = 0; i < 14; i++) heart((i * 97 + t * 0.6) % W, (H - ((t * 0.8 + i * 61) % (H + 40))), 14 + (i % 3) * 5, `rgba(255,${90 + i * 8},${150 + i * 4},0.8)`);
  text('STEPHEN: THE LEGEND OF THE RESCUE', W / 2, 60, 40, '#ffe14a', 'center', 'bold', '#3a1a4a');
  text('Three bosses. One princess. One glorious comeback.', W / 2, 108, 22, '#fff', 'center', 'bold', '#3a1a4a');
  text('Crowned the greatest hero in Mythara history.', W / 2, 140, 18, '#ffe9c8', 'center', 'bold', '#3a1a4a');
  ell(380, 470, 50, 12, 'rgba(0,0,0,0.35)');
  drawStephen(380, 470, 1, { muscles: true, handsome: true, hair: true }, { s: 2.8, sparkle: t % 120 < 20, crown: true });
  drawNicky(560, 470, { s: 2.6, happy: true });
  if (overT > 60) { rr(W / 2 - 300, 486, 600, 30, 8, 'rgba(0,0,0,0.55)'); text('Coming soon: The Return of the Toe-less Terror, Part II', W / 2, 501, 17, '#c69bff', 'center', 'bold'); }
  if (overT > 90) text('THE END  ·  Enter / tap for title', W / 2, 528, 13, '#ddd', 'center', 'normal');
}

function render() {
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.clearRect(0, 0, W, H);
  switch (scene) {
    case 'title': renderTitle(); break;
    case 'story': renderStory(); break;
    case 'level': renderLevel(); break;
    case 'reward': renderReward(); break;
    case 'gameover': renderGameOver(); break;
    case 'victory': renderVictory(); break;
  }
  if (muted) text('MUTED', W - 10, H - 12, 12, '#aaa', 'right', 'normal');
}

/* ---------------- loop ---------------- */
let last = performance.now(), acc = 0;
const STEP = 1000 / 60;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= STEP) {
    update();
    for (const k in pressed) delete pressed[k];
    tapped = false;
    acc -= STEP;
  }
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// small hook for automated testing
window.__sq = {
  get state() { return { scene, chapter: game.chapter, look: game.look, phase: lv && lv.phase, hp: P && P.hp, boss: lv && lv.boss && lv.boss.hp }; },
  jump(ch, look) { game.chapter = ch; game.look = Object.assign({ muscles: false, handsome: false, hair: false }, look || {}); startLevel(); },
  killMinions() { if (lv) { lv.killed = lv.c.minions.count; lv.enemies.forEach(e => e.hp = 0); } },
  god() { if (P) P.inv = 1e9; },
};
